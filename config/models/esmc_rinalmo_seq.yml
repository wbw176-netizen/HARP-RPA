resume: null

model:
  model_type: esmc_rinalmo_seq
  esm_type: 'esmc-600m'
  pooling: mean
  output_dim: 1

  fix_lms: false

  # ESMC DDFT
  lora_tune: true
  lora_rank: 16
  lora_alpha: 32
  break_point: 30

  # RiNALMo DDFT
  rinalmo_lora_tune: true
  rinalmo_lora_rank: 8
  rinalmo_lora_alpha: 16
  rinalmo_full_ft_last_k: 2
  rinalmo_train_ffn: false
  rinalmo_freeze: false

  # sequence-only
  vallina: true
  representation_layer: 33

  transformer:
    embed_dim: 320
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false

train:
  label_standardize: true
  label_std_eps: 1.e-6
  max_iters: 30_000
  val_freq: 1000
  seed: 1337
  optimizer:
    type: adam
    lr: 3.e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 5
    min_lr: 1.e-6
