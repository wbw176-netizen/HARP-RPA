# ckpt: 'outputs/esmc_rinalmo_ddft/PRA310_1337/log_fold_0/checkpoint/15-0.6459.ckpt'
ckpt: 'outputs/esmc_rinalmo_ddft/PRA310_s_1337/log_fold_3/checkpoint/19-0.6019.ckpt'
ckpt_load_mode: model
reset_pred_head: false

run_name: 'harp_rpi_mCSM_finetune'
