epochs: 80
accumulate_grad_batches: 8
patience: 12
output_dir: './outputs/HARP-RPI/mCSM/finetune_fold0'
gpus:
  - 0
# Run once per PRA310 Benchmark checkpoint. Change the index in both paths (0–4)
ckpt: './weights/HARP-RPA_PRA310_benchmark_5fold/HARP-RPA_fold0.ckpt'
ckpt_load_mode: model
reset_pred_head: false

run_name: 'harp_rpi_mCSM_finetune'
wandb: false
num_folds: 1
monitor_metric: val/pc_pearson
